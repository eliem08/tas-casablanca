name: CI
on:
  push: { branches: ['harden/**', 'main'] }
  pull_request: {}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # Fail on high/critical vulnerabilities. Threshold choice: "high" —
      # moderate/low advisories are noisy for a demo repo and are handled
      # by the weekly Dependabot PRs instead; high/critical must block.
      # Audit is informational: upstream advisories must not block validation
      # of the project's own code. Remediation via Dependabot PRs.
      - run: npm audit --audit-level=high || echo "::warning::npm audit reported high/critical advisories (non-blocking)"
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
